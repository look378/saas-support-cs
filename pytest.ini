[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers -p no:cacheprovider
markers =
    unit: 单元测试（纯逻辑，不依赖外部服务）
    integration: 集成测试（依赖 PostgreSQL / Redis / Mock 后端）
    exceptions: 异常与降级专项
    load: 并发与负载
filterwarnings =
    ignore::DeprecationWarning
