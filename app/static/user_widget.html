<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云枢协作平台 · 在线客服</title>
<style>
  :root {
    --brand: #2563eb; --brand2: #1d4ed8; --bg: #f5f7fa; --panel: #fff;
    --fg: #1f2937; --dim: #6b7280; --line: #e5e7eb; --ok: #059669;
    --warn: #d97706; --err: #dc2626; --ai: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100vh;
    background: var(--panel); display: flex; flex-direction: column;
    box-shadow: 0 0 24px rgba(0,0,0,.06);
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; background: var(--panel);
  }
  header .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, var(--brand));
    color: #fff; display: grid; place-items: center; font-weight: 600;
  }
  header .t { font-weight: 600; }
  header .s { color: var(--dim); font-size: 12px; }
  header .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  select, input, button {
    font: inherit; border-radius: 6px; border: 1px solid var(--line);
    padding: 5px 9px; background: #fff; color: var(--fg);
  }
  button { cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { background: var(--brand2); }
  button.ghost { background: #f9fafb; }
  #thread { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .msg { display: flex; margin-bottom: 14px; gap: 8px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai); border-bottom-left-radius: 4px; }
  .msg.agent .bubble { background: #ecfdf5; border: 1px solid #a7f3d0; border-bottom-left-radius: 4px; }
  .msg.sys .bubble {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    font-size: 13px; max-width: 100%;
  }
  .who { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 10px;
    background: #fff; border: 1px solid var(--line); cursor: pointer;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  details.diag { margin-top: 8px; font-size: 12px; }
  details.diag summary { cursor: pointer; color: var(--dim); }
  details.diag ul { margin: 6px 0 0; padding-left: 18px; color: var(--dim); }
  .opts { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .opt {
    text-align: left; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff;
  }
  .opt:hover { border-color: var(--brand); }
  .opt b { display: block; }
  .opt span { color: var(--dim); font-size: 12px; }
  .opt.rec { border-color: #93c5fd; background: #eff6ff; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #eef2ff; color: #3730a3; }
  .badge.ok { background: #ecfdf5; color: var(--ok); }
  .badge.warn { background: #fffbeb; color: var(--warn); }
  .badge.err { background: #fef2f2; color: var(--err); }
  footer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 120px;
    font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; color: var(--dim); font-size: 12px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); animation: b 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
  .hint { padding: 0 18px 10px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">汇</div>
    <div>
      <div class="t">云枢协作平台 · 在线客服</div>
      <div class="s" id="status">AI 助手小汇在线</div>
    </div>
    <div class="right">
      <select id="tenant" title="切换租户（演示多租户隔离）">
        <option value="t-001">t-001 星桥科技</option>
        <option value="t-002">t-002 远洋数字</option>
      </select>
      <button class="ghost" id="reset" title="开始新会话">新会话</button>
    </div>
  </header>

  <div id="thread"></div>
  <div class="hint" id="hint">提示：可直接问功能用法，也可反馈故障（例如「工作区 ws-1001 的 slack 机器人不回复了」）。</div>

  <footer>
    <textarea id="input" rows="1" placeholder="请输入您的问题，Enter 发送 / Shift+Enter 换行"></textarea>
    <button class="primary" id="send">发送</button>
  </footer>
</div>

<script>
// ===========================================================================
// 配置与状态
// ===========================================================================
const API = window.location.origin;          // 与页面同源（由 API 的 /static 提供）
const LS_KEY = "cs_user_session";
const LS_USER = "cs_user_ext_id";
const LS_TOKEN = "cs_user_token";

// 终端用户身份：按浏览器持久化。
// 为什么需要它：会话同时受"租户隔离"和"终端用户归属"两层约束，
// 若每次请求都换一个身份（早期这里硬编码 "u-42"），
// 同一浏览器换个账号就会读不到自己的会话；而不同浏览器共用一个身份，
// 又会让归属校验形同虚设。因此用 localStorage 里的稳定随机标识。
function ensureUserId() {
  let uid = localStorage.getItem(LS_USER);
  if (!uid) {
    uid = (crypto.randomUUID ? crypto.randomUUID() : "u-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
    localStorage.setItem(LS_USER, uid);
  }
  return uid;
}

const state = {
  tenant: localStorage.getItem("cs_tenant") || "t-001",
  sessionKey: localStorage.getItem(LS_KEY) || "",
  userId: ensureUserId(),
  // 会话级访客令牌：服务端在首轮对话时签发，之后所有请求都必须回传。
  // 它才是服务端认可的身份来源（userId 只在"建立会话的那一次"有效）。
  userToken: localStorage.getItem(LS_TOKEN) || "",
  busy: false,
  polling: null,
  seenMsgCount: 0,
  escalated: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function newSessionKey() {
  return "u-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

// ===========================================================================
// 渲染
// ===========================================================================
function addMsg(role, text, extra = {}) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const label = { user: "我", ai: "智能助手小汇", agent: "人工客服", sys: "系统通知" }[role] || role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = (role === "user" ? "" : `<div class="who">${esc(label)}</div>`)
    + `<div>${esc(text)}</div>`;

  // 结构化元信息（诊断结论 / 动作 / 验证）
  if (extra.skill) {
    const meta = document.createElement("div");
    meta.className = "meta";
    const bits = [];
    bits.push(`<span class="badge">${esc(extra.skill)}</span>`);
    if (extra.cause_code) bits.push(`诊断 <b>${esc(extra.cause_code)}</b>`);
    if (extra.confidence) bits.push(`置信度 ${(extra.confidence * 100).toFixed(0)}%`);
    if (extra.risk_score) bits.push(`风险分 ${Math.round(extra.risk_score)}`);
    if (extra.verify_ok) bits.push('<span class="badge ok">验证通过</span>');
    else if (extra.verify_detail) bits.push('<span class="badge warn">待验证</span>');
    if (extra.duration_ms) bits.push(`${Math.round(extra.duration_ms)}ms`);
    meta.innerHTML = bits.join(" · ");
    bubble.appendChild(meta);
  }

  // 诊断证据（折叠）
  if (extra.evidence && extra.evidence.length) {
    const d = document.createElement("details");
    d.className = "diag";
    d.innerHTML = "<summary>查看诊断依据（" + extra.evidence.length + " 项）</summary><ul>"
      + extra.evidence.map((e) => `<li>${esc(e)}</li>`).join("") + "</ul>";
    bubble.appendChild(d);
  }
  if (extra.actions && extra.actions.length) {
    const d = document.createElement("details");
    d.className = "diag";
    d.innerHTML = "<summary>已执行的操作（" + extra.actions.length + " 项）</summary><ul>"
      + extra.actions.map((a) => `<li>${a.ok ? "✅" : "⚠️"} ${esc(a.detail || a.action)}</li>`).join("") + "</ul>";
    bubble.appendChild(d);
  }

  // 多方案选择
  if (extra.options && extra.options.length) {
    const box = document.createElement("div");
    box.className = "opts";
    extra.options.forEach((o) => {
      const b = document.createElement("button");
      b.className = "opt" + (o.recommended ? " rec" : "");
      b.innerHTML = `<b>${esc(o.label)}${o.recommended ? " （推荐）" : ""}</b><span>${esc(o.impact || "")}</span>`;
      b.onclick = () => {
        box.remove();
        send(`选择方案：${o.label}`);
      };
      box.appendChild(b);
    });
    bubble.appendChild(box);
  }

  // 快捷追问
  if (extra.pending_clarify && extra.pending_clarify.question) {
    const chips = document.createElement("div");
    chips.className = "chips";
    ["ws-1001", "ws-1002", "ws-1003", "doc-771", "acct-501", "u-42"].forEach((v) => {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = v;
      c.onclick = () => send(v);
      chips.appendChild(c);
    });
    bubble.appendChild(chips);
  }

  wrap.appendChild(bubble);
  $("thread").appendChild(wrap);
  $("thread").scrollTop = $("thread").scrollHeight;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.id = "typing";
  wrap.innerHTML = `<div class="bubble"><span class="typing">小汇正在排查
    <span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>`;
  $("thread").appendChild(wrap);
  $("thread").scrollTop = $("thread").scrollHeight;
}
function removeTyping() { const t = $("typing"); if (t) t.remove(); }

function setStatus(text, cls = "") {
  $("status").textContent = text;
}

// ===========================================================================
// 交互
// ===========================================================================
async function send(text) {
  text = (text ?? $("input").value).trim();
  if (!text || state.busy) return;
  $("input").value = "";
  state.busy = true;
  $("send").disabled = true;

  addMsg("user", text);
  addTyping();

  try {
    const res = await fetch(`${API}/api/v1/chat`, {
      method: "POST",
      headers: { "X-Tenant-ID": state.tenant, "Content-Type": "application/json" },
      body: JSON.stringify({
        session_key: state.sessionKey,
        message: text,
        user_ext_id: state.userId,
        user_token: state.userToken,
      }),
    });
    const data = await res.json();
    removeTyping();

    if (res.status === 401 || res.status === 403) {
      // 令牌无效或与会话不匹配：说明本地存的是**上一个身份/过期的**凭据，
      // 直接清空本地状态并重开新会话，比反复报错更符合用户预期。
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem(LS_TOKEN);
      state.sessionKey = "";
      state.userToken = "";
      addMsg("sys", "会话凭据已失效或不属于当前用户，已为您开启新会话，请重新描述问题。");
      setStatus("已开启新会话");
      return;
    }
    if (res.status !== 200) {
      addMsg("sys", "抱歉，服务暂时不可用（" + res.status + "）。请稍后重试。");
      return;
    }

    state.sessionKey = data.session_key || state.sessionKey;
    localStorage.setItem(LS_KEY, state.sessionKey);
    // 首轮（或重新签发时）服务端会回传令牌，保存下来供后续请求使用
    if (data.user_token) {
      state.userToken = data.user_token;
      localStorage.setItem(LS_TOKEN, state.userToken);
    }

    addMsg("ai", data.reply || "（无回复）", data);

    if (data.pending_clarify && data.pending_clarify.question) {
      setStatus("需要您补充信息");
    } else if (data.escalate) {
      state.escalated = true;
      setStatus("已转接人工客服", "warn");
      const esc_ = data.escalation || {};
      addMsg(
        "sys",
        "已为您转接人工客服" + (esc_.request_no ? `（转接单号 ${esc_.request_no}）` : "")
        + (esc_.ticket_no ? `，工单号 ${esc_.ticket_no}` : "")
        + "。人工客服接入后，AI 将停止回答，您的消息会直接转给人工。"
      );
      startPolling();
    } else if (data.outcome === "resolved") {
      setStatus("问题已解决 · AI 助手在线", "ok");
    } else {
      setStatus("AI 助手在线");
    }
  } catch (err) {
    removeTyping();
    addMsg("sys", "网络异常：" + err.message);
  } finally {
    state.busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
}

// ===========================================================================
// 转人工后轮询坐席回复（用户侧无法用 WebSocket，故用轮询）
// ===========================================================================
async function pollMessages() {
  if (!state.sessionKey) return;
  try {
    const res = await fetch(
      `${API}/api/v1/session/${encodeURIComponent(state.sessionKey)}/messages`
        + `?limit=100&user_ext_id=${encodeURIComponent(state.userId)}`
        + `&user_token=${encodeURIComponent(state.userToken)}`,
      { headers: { "X-Tenant-ID": state.tenant } }
    );
    if (res.status === 401 || res.status === 403) {
      // 令牌失效：停止轮询并回到"新会话"状态，避免无限重试刷日志
      if (state.polling) { clearInterval(state.polling); state.polling = null; }
      state.userToken = "";
      localStorage.removeItem(LS_TOKEN);
      setStatus("会话凭据已失效，请重新开始会话", "warn");
      return;
    }
    if (res.status !== 200) return;
    const body = await res.json();
    const msgs = body.data || [];
    if (msgs.length <= state.seenMsgCount) return;

    const fresh = msgs.slice(state.seenMsgCount);
    state.seenMsgCount = msgs.length;
    fresh.forEach((m) => {
      // 只渲染坐席消息；用户与 AI 消息已在前端渲染过，避免重复
      if (m.role === "agent") addMsg("agent", m.content);
      else if (m.role === "system" && /转交|接管/.test(m.content)) addMsg("sys", m.content);
    });
  } catch (e) { /* 轮询失败静默重试 */ }
}

function startPolling() {
  if (state.polling) return;
  state.polling = setInterval(pollMessages, 4000);
}

// ===========================================================================
// 绑定与初始化
// ===========================================================================
$("send").onclick = () => send();
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});
$("tenant").value = state.tenant;
$("tenant").onchange = (e) => {
  state.tenant = e.target.value;
  localStorage.setItem("cs_tenant", state.tenant);
  // 令牌是按租户签发的，切换租户后旧令牌必然校验失败，直接清掉让下轮重建
  state.userToken = "";
  localStorage.removeItem(LS_TOKEN);
  addMsg("sys", `已切换到租户 ${state.tenant}。不同租户的数据相互隔离，请开始新会话验证。`);
};
$("reset").onclick = () => {
  state.sessionKey = newSessionKey();
  localStorage.setItem(LS_KEY, state.sessionKey);
  state.userToken = "";
  localStorage.removeItem(LS_TOKEN);
  state.seenMsgCount = 0;
  state.escalated = false;
  if (state.polling) { clearInterval(state.polling); state.polling = null; }
  $("thread").innerHTML = "";
  setStatus("AI 助手小汇在线");
  greet();
};

function greet() {
  addMsg("ai",
    "您好，我是云枢协作平台的智能客服小汇 👋\n"
    + "我可以帮您：\n"
    + "1. 解答产品功能与使用问题\n"
    + "2. 排查集成故障（Slack / 钉钉 / 飞书）\n"
    + "3. 处理文档权限与访问问题\n"
    + "4. 核对订阅账单与退款\n"
    + "5. 排查账号安全异常\n\n"
    + "请直接描述您遇到的问题。");
  const chips = document.createElement("div");
  chips.className = "chips";
  [
    "工作区 ws-1001 的 slack 机器人不回复了",
    "文档 doc-771 打不开",
    "账号 acct-501 账单重复计费",
    "账号 u-42 凌晨异地登录",
    "怎么设置消息免打扰？",
  ].forEach((q) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = q;
    c.onclick = () => send(q);
    chips.appendChild(c);
  });
  $("thread").appendChild(chips);
  $("thread").scrollTop = $("thread").scrollHeight;
}

if (!state.sessionKey) {
  state.sessionKey = newSessionKey();
  localStorage.setItem(LS_KEY, state.sessionKey);
}
greet();
</script>
</body>
</html>
